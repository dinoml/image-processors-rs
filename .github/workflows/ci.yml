name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p image-processors --all-targets --no-default-features -- -D warnings
      - run: cargo test -p image-processors --no-default-features
      - run: cargo clippy --workspace --all-targets --features url -- -D warnings
      - run: cargo test --workspace --features url
      - name: Fetch pinned font for CPU reference checks
        run: |
          curl --fail --location --max-filesize 2097152 --output "$RUNNER_TEMP/Arial.ttf" https://huggingface.co/datasets/JingyeChen22/TextDiffuser/resolve/b4cdbd31d13556c06f8a3480a36d058eb83b4bea/Arial.ttf
          echo "c9b76220a5be42ead4733611e417cd65c5fd8aeaa33eb56576ac378a37d130a1  $RUNNER_TEMP/Arial.ttf" | sha256sum --check
          echo "DINOML_ARIAL_REFERENCE=$RUNNER_TEMP/Arial.ttf" >> "$GITHUB_ENV"
          echo "DINOML_REQUIRE_FONT_REFERENCE=1" >> "$GITHUB_ENV"
      - run: cargo clippy -p image-processors --all-targets --features url,freetype -- -D warnings
      - run: cargo test -p image-processors --features url,freetype

  video-windows:
    if: ${{ false }}
    name: Video Feature (Windows/vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout d4c0a46cb8f63e5c9fa007d13baf1cb3e43bf7e3
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          choco install pkgconfiglite --yes --no-progress
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$pwd"
          "PKG_CONFIG_PATH=$pwd\vcpkg_installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$pwd\vcpkg_installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features

  video-linux:
    if: ${{ false }}
    name: Video Feature (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config
      - name: Check all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features

  video-macos:
    if: ${{ false }}
    name: Video Feature (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg development libraries
        run: |
          brew install ffmpeg@8 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@8)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix ffmpeg@8)/bin" >> "$GITHUB_PATH"
      - name: Check all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features
